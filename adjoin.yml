---
- name: Join RHEL9 to Active Directory
  hosts: all
  become: true

  vars:
    ad_domain: dpwapac.com
    ad_join_user: Domainjoin
    ad_join_password: "D0m$TshU26AGTRF!wo"

  tasks:

    - name: Install required packages
      dnf:
        name:
          - realmd
          - sssd
          - adcli
          - oddjob
          - oddjob-mkhomedir
          - samba-common-tools
          - krb5-workstation
        state: present

    - name: Join AD domain
      expect:
        command: realm join {{ ad_domain }} -U {{ ad_join_user }}
        responses:
          Password.*: "{{ ad_join_password }}"

    - name: Set use_fully_qualified_names to False
      replace:
        path: /etc/sssd/sssd.conf
        regexp: 'use_fully_qualified_names = True'
        replace: 'use_fully_qualified_names = False'

    - name: Set permissions on sssd.conf
      file:
        path: /etc/sssd/sssd.conf
        owner: root
        group: root
        mode: '0600'

    - name: Enable and start services
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - oddjobd
        - sssd

    - name: Clear SSSD cache
      shell: |
        systemctl stop sssd
        rm -rf /var/lib/sss/db/*
        rm -rf /var/lib/sss/mc/*
        systemctl start sssd
      args:
        executable: /bin/bash

    - name: Verify AD user
      command: id appadmin
      register: ad_user
      changed_when: false

    - debug:
        var: ad_user.stdout
