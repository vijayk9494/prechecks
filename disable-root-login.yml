- name: Disable root login override file
  lineinfile:
    path: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    create: yes

- name: Validate sshd configuration
  command: sshd -t

- name: Restart sshd
  service:
    name: sshd
    state: restarted
