---
- name: Configure Postfix relay through Microsoft 365
  hosts: all
  become: true

  vars:
    relay_host: "[smtp.office365.com]:587"
    smtp_username: "postman.DPWAPAC@dpwapac.com"
    smtp_password: "LAtWZe1LbYQ4"

  tasks:

    - name: Install required packages
      dnf:
        name:
          - postfix
          - s-nail
        state: present

    - name: Enable and start postfix
      service:
        name: postfix
        state: started
        enabled: true

    - name: Backup main.cf
      copy:
        src: /etc/postfix/main.cf
        dest: /home/dpadmin/main.cf_bkp
        remote_src: true
        mode: "0644"

    - name: Configure Postfix relay settings
      blockinfile:
        path: /etc/postfix/main.cf
        marker: "# {mark} ANSIBLE OFFICE365 CONFIG"
        block: |
          relayhost = [smtp.office365.com]:587
          inet_protocols = ipv4
          smtp_sasl_auth_enable = yes
          smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd
          smtp_sasl_security_options = noanonymous
          smtp_use_tls = yes
          smtp_tls_security_level = encrypt
          smtp_generic_maps = hash:/etc/postfix/generic

    - name: Create sasl_passwd file
      copy:
        dest: /etc/postfix/sasl_passwd
        content: |
          {{ relay_host }} {{ smtp_username }}:{{ smtp_password }}
        owner: root
        group: root
        mode: "0600"

    - name: Create generic file
      copy:
        dest: /etc/postfix/generic
        content: |
          root postman.DPWAPAC@dpwapac.com
          enterprisedb postman.DPWAPAC@dpwapac.com
          efm postman.DPWAPAC@dpwapac.com
        owner: root
        group: root
        mode: "0644"

    - name: Generate sasl_passwd.db
      command: postmap /etc/postfix/sasl_passwd

    - name: Generate generic.db
      command: postmap /etc/postfix/generic

    - name: Restart postfix
      service:
        name: postfix
        state: restarted
        enabled: true

    - name: Check postfix status
      command: systemctl is-active postfix
      register: postfix_status
      changed_when: false

    - name: Display postfix status
      debug:
        msg: "Postfix service status: {{ postfix_status.stdout }}"
