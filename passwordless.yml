---
- name: Add SSH public key to authorized_keys
  hosts: all
  become: yes

  vars:
    target_user: dpadmin
    public_key: "ssh-rsa  dpadmin@MYSBCPRHELSAT01"

  tasks:
    - name: Ensure .ssh directory exists
      file:
        path: "/home/{{ target_user }}/.ssh"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0700'

    - name: Add public key to authorized_keys
      authorized_key:
        user: "{{ target_user }}"
        state: present
        key: "{{ public_key }}"

    - name: Set authorized_keys permissions
      file:
        path: "/home/{{ target_user }}/.ssh/authorized_keys"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0600'
