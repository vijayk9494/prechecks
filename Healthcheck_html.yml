---
- name: Linux Health Check and Email Report
  hosts: all
  gather_facts: no

  tasks:

    - name: Get hostname
      shell: hostname
      register: hostname_out

    - name: Get CPU Usage %
      shell: |
        top -bn1 | awk -F'id,' '/Cpu/ {
          split($1,a,",");
          gsub(/[^0-9.]/,"",a[length(a)]);
          printf "%.2f",100-a[length(a)]
        }'
      register: cpu_out

    - name: Get Memory Usage %
      shell: |
        free | awk '/Mem:/ {printf "%.2f", ($3/$2)*100}'
      register: mem_out

    - name: Get Disk Usage %
      shell: |
        df -P / | awk 'NR==2 {gsub("%","",$5); print $5}'
      register: disk_out

    - name: Store host data
      set_fact:
        health_data:
          hostname: "{{ hostname_out.stdout }}"
          cpu: "{{ cpu_out.stdout }}"
          memory: "{{ mem_out.stdout }}"
          disk: "{{ disk_out.stdout }}"

- name: Generate HTML and Send Email
  hosts: localhost
  gather_facts: no

  vars:
    report_file: /tmp/LinuxHealthReport.html
    recipient: VijayKumar.Dasari@dpworld.com

  tasks:

    - name: Generate HTML Report
      copy:
        dest: "{{ report_file }}"
        content: |
          <html>
          <head>
          <style>
          body {
              font-family: Segoe UI;
              margin:20px;
          }
          table {
              border-collapse: collapse;
              width: 100%;
          }
          th {
              background:#003366;
              color:white;
              border:1px solid black;
              padding:8px;
          }
          td {
              border:1px solid black;
              padding:8px;
              text-align:center;
          }
          </style>
          </head>
          <body>

          <h2>Linux Server Health Report</h2>

          <table>
          <tr>
              <th>Server</th>
              <th>Hostname</th>
              <th>CPU %</th>
              <th>Memory %</th>
              <th>Disk %</th>
              <th>Status</th>
          </tr>

          {% for host in groups['all'] %}
          {% set cpu = hostvars[host]['health_data']['cpu'] | float %}
          {% set mem = hostvars[host]['health_data']['memory'] | float %}
          {% set disk = hostvars[host]['health_data']['disk'] | float %}

          {% if cpu > 80 or mem > 80 or disk > 80 %}
          {% set color = '#ffcccc' %}
          {% set status = 'ALERT' %}
          {% else %}
          {% set color = '#ccffcc' %}
          {% set status = 'OK' %}
          {% endif %}

          <tr style="background-color:{{ color }}">
              <td>{{ host }}</td>
              <td>{{ hostvars[host]['health_data']['hostname'] }}</td>
              <td>{{ hostvars[host]['health_data']['cpu'] }}</td>
              <td>{{ hostvars[host]['health_data']['memory'] }}</td>
              <td>{{ hostvars[host]['health_data']['disk'] }}</td>
              <td>{{ status }}</td>
          </tr>
          {% endfor %}

          </table>

          </body>
          </html>

    - name: Send Email
      mail:
        host: smtp.office365.com
        port: 587
        secure: starttls
        username: "{{ postman.DPWAPAC@dpwapac.com: }}"
        password: "{{ 9hWHkreScR@ }}"
        from: "{{ dpadmin }}"
        to: "{{ VijayKumar.Dasari@dpworld.com }}"
        subject: "Linux Server Health Report"
        subtype: html
        body: "{{ lookup('file', report_file) }}"
