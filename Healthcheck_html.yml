---
- name: Linux Health Check Report
  hosts: all
  gather_facts: yes

  vars:
    report_file: /tmp/rhel_health_report.html
    jump_server: 10.144.40.68
    email_to: VijayKumar.Dasari@dpworld.com

  tasks:

    - name: Get uptime
      command: uptime -p
      register: uptime_output
      changed_when: false

    - name: Get CPU utilization
      shell: |
        top -bn1 | grep "Cpu(s)" | awk '{print 100-$8}'
      register: cpu_output
      changed_when: false

    - name: Get memory utilization
      shell: |
        free | awk '/Mem:/ {printf "%.2f", ($3/$2)*100}'
      register: memory_output
      changed_when: false

    - name: Save server data
      set_fact:
        server_health:
          hostname: "{{ ansible_hostname }}"
          ip: "{{ ansible_default_ipv4.address | default(inventory_hostname) }}"
          uptime: "{{ uptime_output.stdout }}"
          kernel: "{{ ansible_kernel }}"
          cpu: "{{ cpu_output.stdout | trim }}"
          memory: "{{ memory_output.stdout | trim }}"

    - name: Generate HTML report on jump server
      run_once: true
      delegate_to: "{{ jump_server }}"
      copy:
        dest: "{{ report_file }}"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
          <title>RHEL Health Report</title>
          <style>
          body {font-family: Arial, sans-serif; margin:20px;}
