---
- name: Collect Linux Health Data
  hosts: all
  gather_facts: yes

  tasks:
    - name: Get uptime
      command: uptime -p
      register: uptime_output
      changed_when: false

    - name: Get CPU usage
      shell: |
        top -bn1 | awk '/Cpu\(s\)/ {print 100-$8}'
      register: cpu_output
      changed_when: false

    - name: Get memory usage
      shell: |
        free | awk '/Mem:/ {printf "%.2f", ($3/$2)*100}'
      register: memory_output
      changed_when: false

    - name: Store collected data
      set_fact:
        server_health:
          hostname: "{{ ansible_hostname }}"
          uptime: "{{ uptime_output.stdout }}"
          kernel: "{{ ansible_kernel }}"
          cpu: "{{ cpu_output.stdout | float | round(2) }}"
          memory: "{{ memory_output.stdout | float | round(2) }}"

- name: Generate HTML Report
  hosts: localhost
  gather_facts: no

  vars:
    report_file: "/tmp/rhel_health_report.html"

  tasks:
    - name: Create HTML report
      copy:
        dest: "{{ report_file }}"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
          <title>RHEL Health Report</title>
          <style>
              body { font-family: Arial, sans-serif; margin: 20px; }
              h1 { color: #333; }
              table { border-collapse: collapse; width: 100%; }
              th, td {
                  border: 1px solid #ddd;
                  padding: 8px;
                  text-align: center;
              }
              th {
                  background-color: #0078D7;
                  color: white;
              }
              tr:nth-child(even) {
                  background-color: #f2f2f2;
              }
              .warning {
                  background-color: #ff9999;
              }
          </style>
          </head>
          <body>

          <h1>RHEL Linux Health Report</h1>
          <p>Generated: {{ lookup('pipe','date') }}</p>

          <table>
          <tr>
              <th>Hostname</th>
              <th>Uptime</th>
              <th>Kernel</th>
              <th>CPU Used (%)</th>
              <th>Memory Used (%)</th>
          </tr>

          {% for host in groups['all'] %}
          <tr>
              <td>{{ hostvars[host]['server_health']['hostname'] }}</td>
              <td>{{ hostvars[host]['server_health']['uptime'] }}</td>
              <td>{{ hostvars[host]['server_health']['kernel'] }}</td>

              <td class="{% if hostvars[host]['server_health']['cpu']|float > 80 %}warning{% endif %}">
                  {{ hostvars[host]['server_health']['cpu'] }}
              </td>

              <td class="{% if hostvars[host]['server_health']['memory']|float > 80 %}warning{% endif %}">
                  {{ hostvars[host]['server_health']['memory'] }}
              </td>
          </tr>
          {% endfor %}

          </table>
          </body>
          </html>

    - name: Show report location
      debug:
        msg: "HTML report generated at {{ report_file }}"
