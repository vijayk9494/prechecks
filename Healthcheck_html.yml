---
- name: Collect RHEL Server Health Data
  hosts: all
  gather_facts: yes

  tasks:
    - name: Get uptime
      command: uptime -p
      register: uptime_output
      changed_when: false

    - name: Get CPU usage
      shell: |
        top -bn1 | awk '/Cpu\(s\)/ {print 100-$8}'
      register: cpu_output
      changed_when: false

    - name: Get memory usage
      shell: |
        free | awk '/Mem:/ {printf "%.2f", ($3/$2)*100}'
      register: memory_output
      changed_when: false

    - name: Save server health data
      set_fact:
        server_health:
          hostname: "{{ ansible_hostname }}"
          uptime: "{{ uptime_output.stdout }}"
          kernel: "{{ ansible_kernel }}"
          cpu: "{{ cpu_output.stdout | float | round(2) }}"
          memory: "{{ memory_output.stdout | float | round(2) }}"

- name: Create and Email HTML Report
  hosts: localhost
  gather_facts: false

  vars:
    report_file: /tmp/rhel_health_report.html
    email_to: "VijayKumar.Dasari@dpworld.com"

