<!DOCTYPE html>
<html>
<head>
<title>Linux Server Patching Health Report</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f4f4f4;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    .summary {
        background-color: #ffffff;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
        box-shadow: 0 0 5px #ccc;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background-color: #fff;
    }
    th {
        background-color: #0078D7;
        color: white;
        padding: 10px;
    }
    td {
        padding: 8px;
        text-align: center;
        border: 1px solid #ddd;
    }
    tr:nth-child(even) {
        background-color: #f9f9f9;
    }
    .healthy {
        color: green;
        font-weight: bold;
    }
    .warning {
        color: orange;
        font-weight: bold;
    }
    .critical {
        color: red;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>Linux Patching & Health Check Report</h1>

<div class="summary">
    <h3>Patching Summary</h3>
